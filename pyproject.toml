[project]
name = "tradeos-v3"
version = "0.1.0"
description = "TradeOS V3 clean rebuild focused on safety, reliability, testability, and live/backtest parity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Flask>=3.1,<4",
]
web = ["Flask>=3.1,<4"]
paper = [
    "alpaca-py>=0.35",
]

[tool.setuptools.packages.find]
include = ["tradeos*"]

[tool.setuptools.package-data]
"tradeos.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
